services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tanabesports}
      POSTGRES_USER: ${POSTGRES_USER:-tanabe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tanabe_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 15
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tanabesports}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tanabe}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-tanabe_dev_password}
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/tanabesports_events
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
volumes:
  postgres_data:
  mongo_data:
